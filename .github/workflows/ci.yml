name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  # Superseded PR runs are cancelled; quick successive pushes to main all
  # finish so a red main is never hidden by a cancelled run.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  # Typecheck + Biome + vitest (tenancy suite against Postgres 17) + Traefik
  # static-config drift. Same reusable workflow gates release.yml.
  checks:
    name: Checks
    # On push to main, skip release version-bump commits ([release]). PRs always
    # run. [release] is our own marker — never [skip ci], which GitHub also applies to
    # the tag push and would skip the Release workflow.
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[release]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    uses: ./.github/workflows/checks.yml

  # Production builds of every shippable workspace, so a broken `next build`
  # or tsup bundle is caught on the PR instead of on main.
  build:
    name: Build (${{ matrix.package }})
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[release]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        package: [web, landing, cli]
    env:
      NEXT_TELEMETRY_DISABLED: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Build
        # The panel's `next build` runs with no DATABASE_URL / secrets on
        # purpose: the production image is built the same way (docker/Dockerfile
        # build stage) and packages/server/src/db/index.ts hands the drizzle
        # adapter `undefined` when DATABASE_URL is unset. Do not add dummy
        # secrets here — if a build starts to need them the Dockerfile breaks
        # too, and that is the bug to fix.
        run: pnpm -F @nixploy/${{ matrix.package }} build

  # The exact production image, built (not pushed) with the GHA cache, then
  # scanned on native amd64 and arm64 runners.
  image:
    name: Docker image + Trivy (${{ matrix.arch }})
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[release]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@37fe631027851001ddb9b187196cc803df7f5f0e # v4.3.0

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Runtime packaging regressions
        run: node --test docker/prune-runtime-deps.test.mjs

      - name: Build image (no push)
        uses: docker/build-push-action@53b7df96c91f9c12dcc8a07bcb9ccacbed38856a # v7.3.0
        with:
          context: .
          file: docker/Dockerfile
          pull: true
          platforms: linux/${{ matrix.arch }}
          push: false
          load: true
          tags: nixploy:ci
          build-args: |
            NIXPLOY_APP_VERSION=${{ steps.version.outputs.version }}-ci
            NIXPLOY_GIT_COMMIT=${{ github.sha }}
            NIXPLOY_APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          cache-from: type=gha,scope=ci-${{ matrix.arch }}
          cache-to: type=gha,mode=max,scope=ci-${{ matrix.arch }}

      - name: Trivy report (all severities)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nixploy:ci
          scan-type: image
          scanners: vuln
          format: json
          output: trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload complete vulnerability report
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: trivy-ci-${{ matrix.arch }}
          path: trivy.json
          if-no-files-found: error

      - name: Trivy gate (HIGH and CRITICAL are fatal)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: nixploy:ci
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          skip-setup-trivy: true
          cache: false

      - name: Export image for the e2e job
        # Jobs do not share a Docker daemon, so the e2e job gets the *exact*
        # image this job built rather than rebuilding from the layer cache (a
        # cache miss there would blow the 25-minute budget). gzip -1 keeps the
        # export under a minute; the artifact is deleted after a day.
        run: |
          set -euo pipefail
          docker image save nixploy:ci | gzip -1 > /tmp/nixploy-ci-image.tar.gz
          ls -lh /tmp/nixploy-ci-image.tar.gz

      - name: Upload image artifact
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: nixploy-ci-image-${{ matrix.arch }}
          path: /tmp/nixploy-ci-image.tar.gz
          retention-days: 1
          compression-level: 0

  # The real product, end to end: the PR's own image + Postgres 17 on the
  # runner's Swarm, first admin through /setup, then the REST golden path and
  # the Playwright UI golden path. This is the only job that exercises the
  # deploy engine, migrations-from-zero, Traefik routing and backups together
  # (audit ops-dx #17).
  e2e:
    name: End-to-end (${{ matrix.arch }} image on a real Swarm)
    needs: image
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[release]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - arch: amd64
            runner: ubuntu-latest
          - arch: arm64
            runner: ubuntu-24.04-arm
    timeout-minutes: 25
    env:
      NIXPLOY_E2E_IMAGE: nixploy:ci
      BASE_URL: http://localhost:3000
      E2E_EMAIL: e2e@nixploy.test
      E2E_PASSWORD: E2e-ci-password!1
      # Pinned Playwright; kept in step with tools/e2e-ui.mjs and
      # tools/screenshots/package.json.
      PLAYWRIGHT_VERSION: 1.62.1
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download the PR image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nixploy-ci-image-${{ matrix.arch }}
          path: /tmp

      - name: Load the image
        run: |
          set -euo pipefail
          gunzip -c /tmp/nixploy-ci-image.tar.gz | docker image load
          docker image ls nixploy:ci

      - name: Init Swarm
        # The panel drives the host daemon through the mounted socket; without
        # a Swarm, `docker service create` fails and nothing deploys.
        run: docker swarm init

      - name: Host config root
        # Bind-mounted into the panel at the same path (tools/ci/e2e-compose.yml
        # explains why it cannot be a named volume).
        run: sudo mkdir -p /etc/nixploy && sudo chmod 777 /etc/nixploy

      - name: Ports 80/443 must be free
        # Traefik publishes them in host mode (modules/traefik/setup.ts has no
        # port knob). ubuntu-latest runners have nothing listening there; fail
        # loudly with the culprit if that ever changes.
        run: |
          set -euo pipefail
          if ss -ltnH '( sport = :80 or sport = :443 )' | grep -q .; then
            echo "::error::Something already listens on :80/:443 on this runner"
            ss -ltnp '( sport = :80 or sport = :443 )'
            exit 1
          fi
          echo ":80 and :443 are free"

      - name: Start the stack
        run: docker compose -f tools/ci/e2e-compose.yml up -d

      - name: Wait for /api/ready
        # Migrations run from an empty database in the entrypoint, then the
        # panel provisions Traefik; 180 s covers both on a cold runner.
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            body="$(curl -fsS http://localhost:3000/api/ready 2>/dev/null || true)"
            if [ -n "$body" ]; then
              echo "ready after ${i} attempt(s): $body"
              exit 0
            fi
            sleep 2
          done
          echo "::error::/api/ready never answered"
          curl -sv http://localhost:3000/api/ready || true
          exit 1

      - name: Create the first admin and an API key
        id: bootstrap
        run: node tools/bootstrap-instance.mjs

      - name: API golden path
        env:
          NIXPLOY_URL: http://localhost:3000
          NIXPLOY_API_KEY: ${{ steps.bootstrap.outputs.api-key }}
          # Runner DNS resolves *.traefik.me to 127.0.0.1, but probing the
          # loopback with an explicit Host header removes the dependency.
          SMOKE_TRAEFIK_ORIGIN: http://127.0.0.1
          SMOKE_INSECURE_TLS: "1"
          # Also build one app FROM SOURCE. Every other step deploys a prebuilt
          # image, which is why the v0.2.7 buildx breakage (no builder in the
          # runtime image) passed CI and broke every real build. ~45 s.
          SMOKE_BUILD_REPO: https://github.com/docker/welcome-to-docker.git
          SMOKE_BUILD_TYPE: dockerfile
        run: node tools/golden-path-api.mjs

      - name: Install Playwright (pinned)
        # Into a scratch prefix, not the workspace: the pnpm dependency set is
        # deliberately fixed (CLAUDE.md). Equivalent one-liner for humans:
        # `npx --yes playwright@1.62.1 install --with-deps chromium`.
        run: |
          set -euo pipefail
          npm install --prefix "$RUNNER_TEMP/pw" "playwright@${PLAYWRIGHT_VERSION}"
          "$RUNNER_TEMP/pw/node_modules/.bin/playwright" install --with-deps chromium
          echo "NODE_PATH=$RUNNER_TEMP/pw/node_modules" >> "$GITHUB_ENV"

      - name: UI golden path
        env:
          E2E_SHOTS: ${{ runner.temp }}/ui-shots
        run: node tools/e2e-ui.mjs

      - name: Footprint budget
        # The panel's resident memory after a full golden path (setup, two
        # deploys including a source build, the UI walk), against a ceiling.
        # A regression that doubles the panel's memory is the kind of change
        # that reaches a 4 GB box as an OOM restart and nothing else; this is
        # where it shows first. The live VPS idles at ~390-430 MiB.
        env:
          NIXPLOY_PANEL_RSS_BUDGET_MIB: "768"
        run: |
          set -euo pipefail
          container="$(docker compose -f tools/ci/e2e-compose.yml ps -q app)"
          usage="$(docker stats --no-stream --format '{{.MemUsage}}' "$container")"
          echo "panel memory: $usage"
          used="${usage%%/*}"; used="${used// /}"
          case "$used" in
            *GiB) mib="$(awk -v v="${used%GiB}" 'BEGIN { printf "%d", v * 1024 }')" ;;
            *MiB) mib="$(awk -v v="${used%MiB}" 'BEGIN { printf "%d", v }')" ;;
            *KiB) mib="$(awk -v v="${used%KiB}" 'BEGIN { printf "%d", v / 1024 }')" ;;
            *) echo "::error::unexpected docker stats format: $usage"; exit 1 ;;
          esac
          {
            echo "### Panel footprint"
            echo ""
            echo "| Measure | Value |"
            echo "| --- | --- |"
            echo "| Resident memory after the golden path | ${mib} MiB |"
            echo "| Budget | ${NIXPLOY_PANEL_RSS_BUDGET_MIB} MiB |"
          } >> "$GITHUB_STEP_SUMMARY"
          if [ "$mib" -gt "$NIXPLOY_PANEL_RSS_BUDGET_MIB" ]; then
            echo "::error::panel uses ${mib} MiB, over the ${NIXPLOY_PANEL_RSS_BUDGET_MIB} MiB budget"
            docker stats --no-stream
            exit 1
          fi
          echo "within budget (${mib} / ${NIXPLOY_PANEL_RSS_BUDGET_MIB} MiB)"

      - name: Panel logs
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/e2e-logs"
          docker compose -f tools/ci/e2e-compose.yml logs --timestamps \
            > "$RUNNER_TEMP/e2e-logs/compose.log" 2>&1 || true
          docker service ls > "$RUNNER_TEMP/e2e-logs/services.txt" 2>&1 || true
          docker service ps --no-trunc $(docker service ls -q) \
            > "$RUNNER_TEMP/e2e-logs/service-tasks.txt" 2>&1 || true
          for svc in $(docker service ls --format '{{.Name}}'); do
            docker service logs --timestamps "$svc" \
              > "$RUNNER_TEMP/e2e-logs/service-$svc.log" 2>&1 || true
          done
          sudo cp -r /etc/nixploy "$RUNNER_TEMP/e2e-logs/config-root" 2>/dev/null || true
          sudo chmod -R a+r "$RUNNER_TEMP/e2e-logs" || true

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: e2e-diagnostics-${{ matrix.arch }}
          path: |
            ${{ runner.temp }}/e2e-logs
            ${{ runner.temp }}/ui-shots
          retention-days: 7
          if-no-files-found: ignore

      - name: Tear down
        if: always()
        run: docker compose -f tools/ci/e2e-compose.yml down -v || true

  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: ShellCheck
        # ubuntu-latest ships shellcheck; the apt line only runs if that changes.
        # Baseline 2026-09-10 (shellcheck 0.11.0): 0 findings at every
        # severity, so `warning` is a real gate, not a warning sink.
        # tools/*.sh is a glob because tools/release.sh is not tracked yet
        # (nullglob keeps the list valid either way).
        run: |
          set -euo pipefail
          command -v shellcheck >/dev/null || sudo apt-get install -y --no-install-recommends shellcheck
          shellcheck --version
          shopt -s nullglob
          files=(install.sh update.sh docker/entrypoint.sh tools/*.sh tools/ci/*.sh)
          printf 'checking: %s\n' "${files[@]}"
          shellcheck --severity=warning "${files[@]}"

      - name: Smoke readiness error regression
        run: |
          git fetch --depth 1 origin refs/tags/v0.7.3:refs/tags/v0.7.3
          node --test tools/ci/golden-path-retry.test.mjs

  audit:
    name: pnpm audit
    runs-on: ubuntu-latest
    # Blocking since 2026-09-11. Compatible transitive fixes are recorded in
    # root package.json. One moderate advisory remains in the production graph:
    # @tailwindcss/typography pins postcss-selector-parser 6.0.10, while the fix
    # requires major 7. Nixploy only parses trusted landing CSS at build time.
    # See docs/status.md for the advisory and upstream release boundary.
    # Do not re-add continue-on-error to get a red run green; fix or override
    # the advisory instead.
    continue-on-error: false
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Audit production dependencies
        # Reads the lockfile only; no install needed.
        run: pnpm audit --prod --audit-level high

  template-images:
    name: Template image health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup pnpm
        uses: pnpm/action-setup@ea17c68df8912ef543352723c149a84f56e3d413 # v6.1.0

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Registry manifest check
        env:
          TEMPLATE_IMAGE_CHECK: "1"
        run: pnpm -F @nixploy/server exec vitest run src/modules/templates/images-health.test.ts

  swarm-smoke:
    name: Swarm golden-path smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Init Swarm
        run: docker swarm init

      - name: Overlay network
        run: docker network create --driver overlay --attachable nixploy-network

      - name: Traefik dynamic config
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          root = Path("/tmp/nixploy-smoke/traefik")
          (root / "dynamic").mkdir(parents=True, exist_ok=True)
          (root / "traefik.yml").write_text(
              textwrap.dedent(
                  """\
                  entryPoints:
                    web:
                      address: ":80"
                  providers:
                    file:
                      directory: /etc/traefik/dynamic
                      watch: true
                  """
              ),
              encoding="utf-8",
          )
          (root / "dynamic" / "whoami.yml").write_text(
              textwrap.dedent(
                  """\
                  http:
                    routers:
                      whoami:
                        rule: Host(`whoami.localhost`)
                        entryPoints:
                          - web
                        service: whoami
                    services:
                      whoami:
                        loadBalancer:
                          servers:
                            - url: http://nixploy-smoke-whoami:80
                  """
              ),
              encoding="utf-8",
          )
          print("--- whoami.yml ---")
          print((root / "dynamic" / "whoami.yml").read_text())
          PY

      - name: Deploy whoami + Traefik
        run: |
          docker service create \
            --name nixploy-smoke-whoami \
            --network nixploy-network \
            --replicas 1 \
            traefik/whoami:v1.10.1

          docker service create \
            --name nixploy-smoke-traefik \
            --network nixploy-network \
            --publish published=8080,target=80 \
            --mount type=bind,source=/tmp/nixploy-smoke/traefik/traefik.yml,target=/etc/traefik/traefik.yml \
            --mount type=bind,source=/tmp/nixploy-smoke/traefik/dynamic,target=/etc/traefik/dynamic \
            --replicas 1 \
            traefik:v3.7.13 \
            --configFile=/etc/traefik/traefik.yml

      - name: Wait for Traefik → whoami HTTP 200
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: whoami.localhost' http://127.0.0.1:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "traefik→whoami ok"
              exit 0
            fi
            sleep 2
          done
          echo "traefik routing never became ready"
          echo "--- whoami.yml ---"
          cat /tmp/nixploy-smoke/traefik/dynamic/whoami.yml || true
          docker service ps nixploy-smoke-whoami nixploy-smoke-traefik
          docker service logs nixploy-smoke-traefik || true
          docker service logs nixploy-smoke-whoami || true
          exit 1

      - name: Validate install.sh static config with Traefik
        # Boots traefik:v3.7.13 on the exact traefik.yml install.sh writes to
        # hosts; a heredoc typo would otherwise surface at the next install.
        run: |
          set -euo pipefail
          dir=/tmp/nixploy-smoke/static
          mkdir -p "$dir/dynamic"
          NIXPLOY_RENDER_TRAEFIK_ONLY=1 NIXPLOY_LETSENCRYPT_EMAIL=ci@example.com bash install.sh > "$dir/traefik.yml"
          touch "$dir/acme.json" && chmod 600 "$dir/acme.json"
          cat "$dir/traefik.yml"
          docker run -d --name nixploy-smoke-static \
            -v "$dir/traefik.yml:/etc/traefik/traefik.yml:ro" \
            -v "$dir/dynamic:/etc/nixploy/traefik/dynamic" \
            -v "$dir/acme.json:/etc/nixploy/traefik/acme.json" \
            traefik:v3.7.13 --configFile=/etc/traefik/traefik.yml
          sleep 8
          docker logs nixploy-smoke-static 2>&1 | tee "$dir/traefik.log"
          status="$(docker inspect -f '{{.State.Status}}' nixploy-smoke-static)"
          if [ "$status" != "running" ] || grep -qiE '"level":"error"|level=error|command traefik error' "$dir/traefik.log"; then
            echo "::error::Traefik v3.5.0 rejected the traefik.yml rendered by install.sh (status: $status)"
            exit 1
          fi
          echo "traefik accepted install.sh's static config"

      - name: Cleanup
        if: always()
        run: |
          docker service rm nixploy-smoke-whoami nixploy-smoke-traefik || true
          docker rm -f nixploy-smoke-static || true

  # The failure mode operators fear most — an update that bricks a working
  # install — had no test anywhere. Both legs use install.sh (split worker,
  # signed image verified for real): the latest GitHub release keeps ordinary
  # upgrades covered; the immutable pre-0048 release keeps the populated
  # organization-storage boundary covered after newer releases are published.
  # Each install has Traefik on :80/:443, creates an admin and runs the API golden path,
  # then rolls that install to this commit's image with update.sh through a
  # local registry and runs the golden path again with the SAME API key: the
  # data survived, the migrations applied, and the new image deploys.
  upgrade:
    name: ${{ matrix.check_name }}
    needs: image
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[release]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    runs-on: ubuntu-latest
    timeout-minutes: 35
    strategy:
      fail-fast: false
      matrix:
        include:
          - baseline: latest
            check_name: Upgrade from the latest release
          - baseline: legacy-0048
            check_name: Populated organization storage upgrade
    env:
      # The panel's origin is what the installer wrote to BETTER_AUTH_URL —
      # better-auth refuses a sign-up whose Host does not match it
      # ("Invalid origin"). NIXPLOY_PUBLIC_IP=127.0.0.1 below makes that
      # origin https://127.0.0.1, served by Traefik's catch-all router with
      # the self-signed certificate, so the job talks to the same URL an
      # operator would (and the first run, which used localhost:3000 against
      # a public-IP origin, is how this comment came to exist).
      NIXPLOY_URL: https://127.0.0.1
      E2E_EMAIL: upgrade@nixploy.test
      E2E_PASSWORD: Upgrade-ci-password!1
      LOCAL_IMAGE: localhost:5000/nixploy:ci
      # Verified release source and signed multi-architecture image. The tag's
      # journal ends at 0046 and organization still stores plaintext metadata.
      # The exact Fulcio release identity and GitHub workflow SHA are checked
      # below; install.sh also performs its normal signed-digest verification.
      LEGACY_RELEASE_TAG: v0.7.3
      LEGACY_RELEASE_SHA: c4aa992ecf7f2bd7667fd84413b43c977d467fd1
      LEGACY_RELEASE_IMAGE: ghcr.io/bablilayoub/nixploy@sha256:a0c0ec2abbf45f90193026951f59eee722a68016d485274ddb114fa77fc0ee2e
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Download the PR image
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          name: nixploy-ci-image-amd64
          path: /tmp

      - name: Load the image into a local registry
        # update.sh pulls before it rolls (a Swarm needs a pullable ref), so
        # the PR image is served from a registry on localhost. A localhost
        # registry is insecure by default for the daemon; nothing to configure.
        run: |
          set -euo pipefail
          gunzip -c /tmp/nixploy-ci-image.tar.gz | docker image load
          docker run -d --name ci-registry -p 127.0.0.1:5000:5000 registry:2
          for i in $(seq 1 20); do curl -fsS http://127.0.0.1:5000/v2/ >/dev/null && break; sleep 1; done
          docker tag nixploy:ci "$LOCAL_IMAGE"
          docker push "$LOCAL_IMAGE"

      - name: Ports 80/443 must be free
        run: |
          set -euo pipefail
          if ss -ltnH '( sport = :80 or sport = :443 )' | grep -q .; then
            echo "::error::Something already listens on :80/:443 on this runner"
            ss -ltnp '( sport = :80 or sport = :443 )'
            exit 1
          fi

      - name: Resolve upgrade baseline
        id: release
        env:
          UPGRADE_BASELINE: ${{ matrix.baseline }}
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail
          case "$UPGRADE_BASELINE" in
            latest)
              tag="$(curl -fsSL -H "Authorization: Bearer $GH_TOKEN" \
                "https://api.github.com/repos/$GITHUB_REPOSITORY/releases/latest" | jq -r .tag_name)"
              ;;
            legacy-0048)
              tag="$LEGACY_RELEASE_TAG"
              echo "image=$LEGACY_RELEASE_IMAGE" >> "$GITHUB_OUTPUT"
              ;;
            *) echo "::error::unknown upgrade baseline"; exit 1 ;;
          esac
          [[ "$tag" =~ ^v[0-9]+\.[0-9]+\.[0-9]+([.-][A-Za-z0-9.-]+)?$ ]] || { echo "::error::invalid release tag"; exit 1; }
          echo "tag=$tag" >> "$GITHUB_OUTPUT"
          git fetch --depth 1 origin "refs/tags/$tag:refs/tags/$tag"
          source="$(git rev-parse "refs/tags/$tag^{commit}")"
          if [ "$UPGRADE_BASELINE" = legacy-0048 ]; then
            [ "$source" = "$LEGACY_RELEASE_SHA" ] || { echo "::error::legacy release tag moved from its pinned source"; exit 1; }
            git show "$source:packages/server/drizzle/meta/_journal.json" | node --input-type=module -e '
              let text=""; for await (const chunk of process.stdin) text+=chunk;
              const entries=JSON.parse(text).entries;
              if (!entries.length || entries.some(entry=>Number(entry.idx)>=48)) throw new Error("Legacy release is not before migration 0048");
            '
          fi
          echo "source=$source" >> "$GITHUB_OUTPUT"
          echo "upgrade baseline: $UPGRADE_BASELINE; release: $tag; source: $source"
          # The release's own bootstrap and smoke scripts drive the release's
          # panel: the copies on this branch may already use a procedure the
          # old version does not have. Read the resolved commit, never a tag
          # that could move between resolving the release and extracting it.
          mkdir -p /tmp/release-tools
          git show "$source:tools/bootstrap-instance.mjs" > /tmp/release-tools/bootstrap-instance.mjs
          # Preserve the release's API sequence, but decode the REST error
          # before its readiness matcher runs. Raw JSON escapes the quotes in
          # `database "smokedb" does not exist`, hiding that known precondition.
          git show "$source:tools/golden-path-api.mjs" | \
            sed 's/text\.slice(0, 600)/String(data?.message ?? text).slice(0, 600)/' \
            > /tmp/release-tools/golden-path-api.mjs

      - name: Install cosign for pinned legacy provenance
        if: matrix.baseline == 'legacy-0048'
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2
        with:
          cosign-release: v3.1.3

      - name: Verify the immutable legacy release identity and source
        if: matrix.baseline == 'legacy-0048'
        run: |
          set -euo pipefail
          cosign verify \
            --certificate-identity "https://github.com/bablilayoub/nixploy/.github/workflows/release.yml@refs/tags/$LEGACY_RELEASE_TAG" \
            --certificate-oidc-issuer https://token.actions.githubusercontent.com \
            --certificate-github-workflow-sha "$LEGACY_RELEASE_SHA" \
            "$LEGACY_RELEASE_IMAGE" >/dev/null
          echo "legacy release signature verified: $LEGACY_RELEASE_IMAGE; source: $LEGACY_RELEASE_SHA"

      - name: Install the baseline release with install.sh
        # The repo's install.sh (the one under test) installs the selected
        # published image: NIXPLOY_PORT also publishes :3000 so the bootstrap
        # and the smoke can talk to the panel without a domain; the split
        # worker is the shape production runs; the signed image goes through
        # the real cosign check using the installed or SHA-verified binary.
        env:
          NIXPLOY_VERSION: ${{ steps.release.outputs.tag }}
          NIXPLOY_IMAGE: ${{ steps.release.outputs.image }}
        run: |
          set -euo pipefail
          sudo env \
            NIXPLOY_VERSION="$NIXPLOY_VERSION" \
            NIXPLOY_IMAGE="$NIXPLOY_IMAGE" \
            NIXPLOY_SKIP_DOCKER_INSTALL=1 \
            NIXPLOY_PUBLIC_IP=127.0.0.1 \
            NIXPLOY_PORT=3000 \
            NIXPLOY_SPLIT_WORKER=1 \
            NIXPLOY_LETSENCRYPT_EMAIL=ci@example.com \
            bash install.sh
          echo "--- services"
          docker service ls

      - name: Panel is ready through Traefik
        id: before
        # install.sh checks the new task directly; Swarm keeps it out of the
        # service VIP until its first successful health probe, so Traefik
        # answers 502 for up to a minute after "App is up". Wait the way an
        # operator's browser would: through :443.
        run: |
          set -euo pipefail
          for i in $(seq 1 90); do
            body="$(curl -ksS --max-time 5 https://127.0.0.1/api/ready 2>/dev/null || true)"
            case "$body" in *'"ok":true'*) break ;; esac
            body=""
            sleep 2
          done
          echo "ready: $body"
          [ -n "$body" ] || { echo "::error::/api/ready never answered 200 through Traefik"; docker service ls; exit 1; }
          curl -ksS https://127.0.0.1/api/version
          echo "image=$(docker service inspect nixploy --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')" >> "$GITHUB_OUTPUT"

      - name: Read the installer's setup token
        # A production install refuses to create the first admin without the
        # token install.sh generated (NIXPLOY_SETUP_TOKEN in the config root's
        # .env). Masked before it can reach a log line.
        run: |
          set -euo pipefail
          token="$(sudo grep '^NIXPLOY_SETUP_TOKEN=' /etc/nixploy/.env | cut -d= -f2- | tr -d '"')"
          [ -n "$token" ] || { echo "::error::NIXPLOY_SETUP_TOKEN not found in /etc/nixploy/.env"; exit 1; }
          echo "::add-mask::$token"
          echo "NIXPLOY_SETUP_TOKEN=$token" >> "$GITHUB_ENV"

      - name: Create the first admin and an API key
        id: bootstrap
        env:
          # Self-signed certificate on the panel origin (see the job env).
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
        run: node /tmp/release-tools/bootstrap-instance.mjs

      - name: API golden path on the release
        env:
          NIXPLOY_API_KEY: ${{ steps.bootstrap.outputs.api-key }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          SMOKE_TRAEFIK_ORIGIN: http://127.0.0.1
          SMOKE_INSECURE_TLS: "1"
        run: node /tmp/release-tools/golden-path-api.mjs

      - name: Seed legacy variables and reject unsafe candidate boots
        if: matrix.baseline == 'legacy-0048'
        env:
          NIXPLOY_API_KEY: ${{ steps.bootstrap.outputs.api-key }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          UPGRADE_PROOF_DISPOSABLE: "1"
          UPGRADE_PROOF_TARGET_IMAGE: ${{ env.LOCAL_IMAGE }}
          UPGRADE_PROOF_FILE: ${{ runner.temp }}/organization-upgrade-proof.private.json
        run: node tools/ci/organization-upgrade-proof.mjs before

      - name: Update to this commit's image with update.sh
        run: |
          set -euo pipefail
          sudo env \
            NIXPLOY_IMAGE="$LOCAL_IMAGE" \
            NIXPLOY_UPDATE_TRAEFIK=0 \
            bash update.sh
          echo "--- services"
          docker service ls
          docker service ps nixploy nixploy-worker --no-trunc | head -n 12

      - name: The new image is what runs
        env:
          BEFORE_IMAGE: ${{ steps.before.outputs.image }}
        run: |
          set -euo pipefail
          after="$(docker service inspect nixploy --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
          worker="$(docker service inspect nixploy-worker --format '{{.Spec.TaskTemplate.ContainerSpec.Image}}')"
          echo "before: $BEFORE_IMAGE"
          echo "after:  $after"
          echo "worker: $worker"
          case "$after" in "$LOCAL_IMAGE"*) ;; *) echo "::error::nixploy still runs $after"; exit 1 ;; esac
          case "$worker" in "$LOCAL_IMAGE"*) ;; *) echo "::error::nixploy-worker still runs $worker"; exit 1 ;; esac
          for i in $(seq 1 90); do
            body="$(curl -ksS --max-time 5 https://127.0.0.1/api/ready 2>/dev/null || true)"
            case "$body" in *'"ok":true'*) echo "ready: $body"; break ;; esac
            body=""
            sleep 2
          done
          [ -n "$body" ] || { echo "::error::/api/ready never answered 200 through Traefik after the update"; docker service ls; exit 1; }
          curl -ksS https://127.0.0.1/api/version

      - name: Verify encrypted storage and inherited variables on the updated worker
        if: matrix.baseline == 'legacy-0048'
        env:
          NIXPLOY_API_KEY: ${{ steps.bootstrap.outputs.api-key }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          UPGRADE_PROOF_DISPOSABLE: "1"
          UPGRADE_PROOF_TARGET_IMAGE: ${{ env.LOCAL_IMAGE }}
          UPGRADE_PROOF_FILE: ${{ runner.temp }}/organization-upgrade-proof.private.json
        run: node tools/ci/organization-upgrade-proof.mjs after

      - name: API golden path after the update, same key
        # The key was created on the old version; a working run here means
        # the data and the schema migration both survived the roll, and the
        # new image builds and deploys on this Swarm.
        env:
          NIXPLOY_API_KEY: ${{ steps.bootstrap.outputs.api-key }}
          NODE_TLS_REJECT_UNAUTHORIZED: "0"
          SMOKE_TRAEFIK_ORIGIN: http://127.0.0.1
          SMOKE_INSECURE_TLS: "1"
          SMOKE_BUILD_REPO: https://github.com/docker/welcome-to-docker.git
          SMOKE_BUILD_TYPE: dockerfile
        run: node tools/golden-path-api.mjs

      - name: Diagnostics
        if: failure()
        run: |
          mkdir -p "$RUNNER_TEMP/upgrade-logs"
          # Allowlist state fields. Raw installer/update/task/health output can
          # carry tokens, SQL or restored data and stays private on the runner.
          docker service ls --format '{{.ID}} {{.Name}} {{.Replicas}} {{.Image}}' \
            > "$RUNNER_TEMP/upgrade-logs/services.txt" 2>/dev/null || true
          for svc in $(docker service ls -q); do
            docker service ps --no-trunc --format '{{.ID}} {{.Name}} {{.Node}} {{.DesiredState}} {{.CurrentState}}' "$svc" \
              >> "$RUNNER_TEMP/upgrade-logs/service-tasks.txt" 2>/dev/null || true
          done
          for cid in $(docker ps -aq --filter label=com.docker.swarm.service.name); do
            docker inspect --format '{{.Id}} {{.Name}} {{.State.Status}} {{if .State.Health}}{{.State.Health.Status}}{{end}}' "$cid" \
              >> "$RUNNER_TEMP/upgrade-logs/container-health.txt" 2>/dev/null || true
          done
          # Config/backups include full service Env, keys, SQL dumps and matching
          # recovery archives. Keep them private on the runner, along with the
          # proof state and candidate boot logs; never upload the config tree.

      - name: Upload diagnostics
        if: failure()
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: upgrade-diagnostics-${{ matrix.baseline }}
          path: |
            ${{ runner.temp }}/upgrade-logs/services.txt
            ${{ runner.temp }}/upgrade-logs/service-tasks.txt
            ${{ runner.temp }}/upgrade-logs/container-health.txt
          retention-days: 7
          if-no-files-found: ignore

  # The installers verify the image's cosign signature and pin the pull to
  # the signed digest before anything runs. This job runs that exact block
  # (extracted from install.sh and update.sh by its markers) with a real
  # cosign against one immutable signed main digest. Docker publishes :main
  # only AFTER signing and these same checks; its own run also verifies its
  # exact output, without looking at the shared tag.
  installer-signature:
    name: Installer signature check
    runs-on: ubuntu-latest
    if: github.event_name != 'pull_request' || github.event.pull_request.head.repo.full_name == github.repository
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Resolve and pin the signed baseline once
        id: image
        run: |
          set -euo pipefail
          pinned="$(tools/ci/verify-image-signature.sh ghcr.io/bablilayoub/nixploy:main | tail -n 1)"
          case "${pinned}" in
            ghcr.io/bablilayoub/nixploy:main@sha256:*) ;;
            *) echo "::error::install.sh did not pin the image to its signed digest"; exit 1 ;;
          esac
          echo "signed=$pinned" >> "$GITHUB_OUTPUT"
          # Only the multi-arch index is signed; its build manifests are an
          # actual unsigned-artifact negative case, from the same repository.
          child="$(docker buildx imagetools inspect "$pinned" --raw | jq -er '.manifests[] | select(.platform.os == "linux" and .platform.architecture == "amd64") | .digest')"
          echo "unsigned=ghcr.io/bablilayoub/nixploy@$child" >> "$GITHUB_OUTPUT"

      - name: Both installers accept the digest and reject missing or foreign signatures
        env:
          SIGNED_IMAGE: ${{ steps.image.outputs.signed }}
          UNSIGNED_IMAGE: ${{ steps.image.outputs.unsigned }}
        run: tools/ci/check-installer-signatures.sh "$SIGNED_IMAGE" "$UNSIGNED_IMAGE"

  # Optional full API golden path against an *external* running Nixploy
  # (secrets required). The `e2e` job above runs the same script against the
  # PR's own image on every PR; this one is for pointing it at staging.
  api-golden-path:
    name: API golden-path (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Setup Node
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: 22

      - name: Run API smoke
        env:
          NIXPLOY_URL: ${{ secrets.NIXPLOY_SMOKE_URL }}
          NIXPLOY_API_KEY: ${{ secrets.NIXPLOY_SMOKE_API_KEY }}
          # The panel is somewhere else; this runner's Docker daemon knows
          # nothing about its Swarm, so the leftover check would be meaningless.
          SMOKE_SKIP_DOCKER_CHECK: "1"
        run: |
          if [ -z "$NIXPLOY_URL" ] || [ -z "$NIXPLOY_API_KEY" ]; then
            echo "Set NIXPLOY_SMOKE_URL and NIXPLOY_SMOKE_API_KEY secrets to enable this job"
            exit 0
          fi
          node tools/golden-path-api.mjs
