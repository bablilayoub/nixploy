name: CI

on:
  pull_request:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  check:
    name: Typecheck & test
    # On push to main, skip release version-bump commits ([skip ci]). PRs always run.
    if: >-
      github.event_name != 'push' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: nixploy
          POSTGRES_PASSWORD: nixploy
          POSTGRES_DB: nixploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nixploy -d nixploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nixploy:nixploy@localhost:5432/nixploy_test
      DATABASE_URL_TEST: postgres://nixploy:nixploy@localhost:5432/nixploy_test
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Traefik static config drift
        # install.sh, update.sh, docker/traefik/traefik.yml and setup.ts each
        # carry the static config; a stale copy would otherwise ship green.
        run: |
          set -euo pipefail
          email="drift-check@example.com"
          NIXPLOY_RENDER_TRAEFIK_ONLY=1 NIXPLOY_LETSENCRYPT_EMAIL="$email" bash install.sh > /tmp/traefik-install.yml
          NIXPLOY_RENDER_TRAEFIK_ONLY=1 NIXPLOY_LETSENCRYPT_EMAIL="$email" bash update.sh > /tmp/traefik-update.yml
          sed '/^#/d' docker/traefik/traefik.yml | sed "s/^\( *email: \).*/\1$email/" > /tmp/traefik-template.yml
          (cd packages/server && EMAIL="$email" env -u DATABASE_URL pnpm exec tsx -e \
            'import { buildTraefikStaticConfig } from "./src/modules/traefik/setup"; process.stdout.write(buildTraefikStaticConfig(process.env.EMAIL))') \
            > /tmp/traefik-setup.yml
          for name in install update template; do
            diff -u /tmp/traefik-setup.yml "/tmp/traefik-$name.yml" \
              || { echo "::error::$name traefik.yml drifted from setup.ts#buildTraefikStaticConfig"; exit 1; }
          done
          echo "traefik static config: install.sh, update.sh, template and setup.ts agree"

      - name: Biome
        run: pnpm exec biome check packages/server apps/web apps/cli apps/landing

      - name: Typecheck
        run: pnpm typecheck

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Unit tests
        run: pnpm test

  template-images:
    name: Template image health
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Registry manifest check
        env:
          TEMPLATE_IMAGE_CHECK: "1"
        run: pnpm -F @nixploy/server exec vitest run src/modules/templates/images-health.test.ts

  swarm-smoke:
    name: Swarm golden-path smoke
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Init Swarm
        run: docker swarm init

      - name: Overlay network
        run: docker network create --driver overlay --attachable nixploy-network

      - name: Traefik dynamic config
        run: |
          python3 <<'PY'
          from pathlib import Path
          import textwrap

          root = Path("/tmp/nixploy-smoke/traefik")
          (root / "dynamic").mkdir(parents=True, exist_ok=True)
          (root / "traefik.yml").write_text(
              textwrap.dedent(
                  """\
                  entryPoints:
                    web:
                      address: ":80"
                  providers:
                    file:
                      directory: /etc/traefik/dynamic
                      watch: true
                  """
              ),
              encoding="utf-8",
          )
          (root / "dynamic" / "whoami.yml").write_text(
              textwrap.dedent(
                  """\
                  http:
                    routers:
                      whoami:
                        rule: Host(`whoami.localhost`)
                        entryPoints:
                          - web
                        service: whoami
                    services:
                      whoami:
                        loadBalancer:
                          servers:
                            - url: http://nixploy-smoke-whoami:80
                  """
              ),
              encoding="utf-8",
          )
          print("--- whoami.yml ---")
          print((root / "dynamic" / "whoami.yml").read_text())
          PY

      - name: Deploy whoami + Traefik
        run: |
          docker service create \
            --name nixploy-smoke-whoami \
            --network nixploy-network \
            --replicas 1 \
            traefik/whoami:v1.10.1

          docker service create \
            --name nixploy-smoke-traefik \
            --network nixploy-network \
            --publish published=8080,target=80 \
            --mount type=bind,source=/tmp/nixploy-smoke/traefik/traefik.yml,target=/etc/traefik/traefik.yml \
            --mount type=bind,source=/tmp/nixploy-smoke/traefik/dynamic,target=/etc/traefik/dynamic \
            --replicas 1 \
            traefik:v3.5.0 \
            --configFile=/etc/traefik/traefik.yml

      - name: Wait for Traefik → whoami HTTP 200
        run: |
          for i in $(seq 1 40); do
            code=$(curl -s -o /dev/null -w '%{http_code}' -H 'Host: whoami.localhost' http://127.0.0.1:8080/ || true)
            if [ "$code" = "200" ]; then
              echo "traefik→whoami ok"
              exit 0
            fi
            sleep 2
          done
          echo "traefik routing never became ready"
          echo "--- whoami.yml ---"
          cat /tmp/nixploy-smoke/traefik/dynamic/whoami.yml || true
          docker service ps nixploy-smoke-whoami nixploy-smoke-traefik
          docker service logs nixploy-smoke-traefik || true
          docker service logs nixploy-smoke-whoami || true
          exit 1

      - name: Validate install.sh static config with Traefik
        # Boots traefik:v3.5.0 on the exact traefik.yml install.sh writes to
        # hosts; a heredoc typo would otherwise surface at the next install.
        run: |
          set -euo pipefail
          dir=/tmp/nixploy-smoke/static
          mkdir -p "$dir/dynamic"
          NIXPLOY_RENDER_TRAEFIK_ONLY=1 NIXPLOY_LETSENCRYPT_EMAIL=ci@example.com bash install.sh > "$dir/traefik.yml"
          touch "$dir/acme.json" && chmod 600 "$dir/acme.json"
          cat "$dir/traefik.yml"
          docker run -d --name nixploy-smoke-static \
            -v "$dir/traefik.yml:/etc/traefik/traefik.yml:ro" \
            -v "$dir/dynamic:/etc/nixploy/traefik/dynamic" \
            -v "$dir/acme.json:/etc/nixploy/traefik/acme.json" \
            traefik:v3.5.0 --configFile=/etc/traefik/traefik.yml
          sleep 8
          docker logs nixploy-smoke-static 2>&1 | tee "$dir/traefik.log"
          status="$(docker inspect -f '{{.State.Status}}' nixploy-smoke-static)"
          if [ "$status" != "running" ] || grep -qiE '"level":"error"|level=error|command traefik error' "$dir/traefik.log"; then
            echo "::error::Traefik v3.5.0 rejected the traefik.yml rendered by install.sh (status: $status)"
            exit 1
          fi
          echo "traefik accepted install.sh's static config"

      - name: Cleanup
        if: always()
        run: |
          docker service rm nixploy-smoke-whoami nixploy-smoke-traefik || true
          docker rm -f nixploy-smoke-static || true

  # Optional full API golden path against a running Nixploy (secrets required).
  api-golden-path:
    name: API golden-path (manual)
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Run API smoke
        env:
          NIXPLOY_URL: ${{ secrets.NIXPLOY_SMOKE_URL }}
          NIXPLOY_API_KEY: ${{ secrets.NIXPLOY_SMOKE_API_KEY }}
        run: |
          if [ -z "$NIXPLOY_URL" ] || [ -z "$NIXPLOY_API_KEY" ]; then
            echo "Set NIXPLOY_SMOKE_URL and NIXPLOY_SMOKE_API_KEY secrets to enable this job"
            exit 0
          fi
          node tools/golden-path-api.mjs
