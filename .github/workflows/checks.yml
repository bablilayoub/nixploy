name: Checks

# Reusable quality gate. Consumed by:
#   - ci.yml       on every pull request and push to main
#   - release.yml  on the tagged ref, before the release image is built
# One definition so the release gate cannot drift from what PRs run.
# Local equivalent (docs/development.md):
#   pnpm typecheck && pnpm exec biome check packages/server apps/web apps/cli apps/landing \
#     && DATABASE_URL_TEST=… pnpm test:db && pnpm -F @nixploy/cli test

on:
  workflow_call:
    inputs:
      ref:
        description: "Git ref to check out (empty = the caller's ref)"
        type: string
        required: false
        default: ""

permissions:
  contents: read

jobs:
  check:
    name: Typecheck, lint & test
    runs-on: ubuntu-latest
    services:
      postgres:
        # Production (install.sh POSTGRES_VERSION) and dev (docs/development.md)
        # run Postgres 17 — CI must not pass on 16-only behaviour.
        image: postgres:17
        env:
          POSTGRES_USER: nixploy
          POSTGRES_PASSWORD: nixploy
          POSTGRES_DB: nixploy_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U nixploy -d nixploy_test"
          --health-interval 5s
          --health-timeout 5s
          --health-retries 10
    env:
      DATABASE_URL: postgres://nixploy:nixploy@localhost:5432/nixploy_test
      DATABASE_URL_TEST: postgres://nixploy:nixploy@localhost:5432/nixploy_test
      ENCRYPTION_KEY: "0123456789abcdef0123456789abcdef0123456789abcdef0123456789abcdef"
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          ref: ${{ inputs.ref }}

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          cache: pnpm

      - name: Install
        run: pnpm install --frozen-lockfile

      - name: Traefik static config drift
        # install.sh, update.sh, docker/traefik/traefik.yml and setup.ts each
        # carry the static config; a stale copy would otherwise ship green.
        run: |
          set -euo pipefail
          email="drift-check@example.com"
          NIXPLOY_RENDER_TRAEFIK_ONLY=1 NIXPLOY_LETSENCRYPT_EMAIL="$email" bash install.sh > /tmp/traefik-install.yml
          NIXPLOY_RENDER_TRAEFIK_ONLY=1 NIXPLOY_LETSENCRYPT_EMAIL="$email" bash update.sh > /tmp/traefik-update.yml
          sed '/^#/d' docker/traefik/traefik.yml | sed "s/^\( *email: \).*/\1$email/" > /tmp/traefik-template.yml
          (cd packages/server && EMAIL="$email" env -u DATABASE_URL pnpm exec tsx -e \
            'import { buildTraefikStaticConfig } from "./src/modules/traefik/setup"; process.stdout.write(buildTraefikStaticConfig(process.env.EMAIL))') \
            > /tmp/traefik-setup.yml
          for name in install update template; do
            diff -u /tmp/traefik-setup.yml "/tmp/traefik-$name.yml" \
              || { echo "::error::$name traefik.yml drifted from setup.ts#buildTraefikStaticConfig"; exit 1; }
          done
          echo "traefik static config: install.sh, update.sh, template and setup.ts agree"

      - name: Biome
        # `--error-on-warnings`: most recommended rules default to `warn`, which
        # biome exits 0 on — a warning would otherwise ship green forever (the
        # `noConfusingVoidType` one did). biome.json raises the rules we care
        # about to `error` on top of this for the editor.
        run: pnpm exec biome check --error-on-warnings packages/server apps/web apps/cli apps/landing

      - name: Typecheck
        run: pnpm typecheck

      - name: Dead code (knip, pinned)
        # Pinned exactly, and via `pnpm dlx` rather than a devDependency: the
        # workspace dependency set is deliberately fixed (CLAUDE.md). knip.json
        # carries the entry points (Next apps, the tsx `server.ts`/`worker.ts`,
        # vitest, the CLI bin, tools/ and docker/migrate.mjs) and the
        # deliberate exceptions; it gates unused files, unlisted/unused
        # dependencies and exports with no consumer anywhere.
        run: pnpm dlx knip@5.88.1 --reporter compact

      - name: Migrate test database
        run: pnpm db:migrate

      - name: Unit tests (incl. tenancy isolation against Postgres)
        # `test:db`, not `test`: it refuses to run without DATABASE_URL_TEST and
        # prints the skipped-test inventory, so a Postgres-backed suite that
        # quietly stopped running cannot pass for green (audit ops-dx #20).
        run: pnpm test:db

      - name: CLI tests
        run: pnpm -F @nixploy/cli test

      - name: Web tests
        # `--if-present`: apps/web has no `test` script on every branch yet.
        # Drop the flag once it does.
        run: pnpm -F @nixploy/web run --if-present test
