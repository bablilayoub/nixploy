name: Docker

# Continuous images for every main push: ghcr.io/<repo>:main and :<sha>, both
# linux/amd64 + linux/arm64 with provenance + SBOM. :latest and :vX.Y.Z are
# owned by release.yml only (docs/releases.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Version / release commits use [skip ci] so only Release (tag v[0-9]*) builds that image.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up QEMU
        # linux/arm64 is emulated on the amd64 runner: the Next.js build runs
        # under QEMU and takes several times longer than the native build.
        # Native `ubuntu-24.04-arm` runners plus a manifest merge would be the
        # fast path if main builds start to queue.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Continuous builds: `main` + commit sha only. `latest` is the release
          # channel the in-app updater tracks and is moved solely by the Release
          # workflow on a tag push (docs/releases.md).
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SPDX SBOM are attached as attestation manifests
          # (they show up as extra "unknown/unknown" entries in the GHCR UI).
          provenance: true
          sbom: true
          build-args: |
            NIXPLOY_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max
