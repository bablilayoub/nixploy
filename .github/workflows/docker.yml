name: Docker

# Continuous images for every main push: ghcr.io/<repo>:main and :<sha>, both
# linux/amd64 + linux/arm64 with provenance + SBOM, signed with cosign
# (keyless). :latest and :vX.Y.Z are owned by release.yml only
# (docs/releases.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign: the job exchanges this OIDC token for a short-lived
  # Fulcio certificate and records the signature in Rekor. No private key,
  # nothing to rotate — see docs/releases.md for the verify command.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build-and-push:
    # Version / release commits use [skip ci] so only Release (tag v[0-9]*) builds that image.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[skip ci]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Set up QEMU
        # linux/arm64 is emulated on the amd64 runner: the Next.js build runs
        # under QEMU and takes several times longer than the native build.
        # Native `ubuntu-24.04-arm` runners plus a manifest merge would be the
        # fast path if main builds start to queue.
        uses: docker/setup-qemu-action@c7c53464625b32c7a7e944ae62b3e17d2b600130 # v3.7.0
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@8d2750c68a42422c14e847fe6c8ac0403b4cbd6f # v3.12.0

      - name: Log in to GHCR
        uses: docker/login-action@c94ce9fb468520275223c153574b00df6fe4bcc9 # v3.7.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@c299e40c65443455700f0fdfc63efafe5b349051 # v5.10.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Continuous builds: `main` + commit sha only. `latest` is the release
          # channel the in-app updater tracks and is moved solely by the Release
          # workflow on a tag push (docs/releases.md).
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push
        id: build
        uses: docker/build-push-action@10e90e3645eae34f1e60eeb005ba3a3d33f178e8 # v6.19.2
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SPDX SBOM are attached as attestation manifests
          # (they show up as extra "unknown/unknown" entries in the GHCR UI).
          provenance: true
          sbom: true
          build-args: |
            NIXPLOY_APP_VERSION=${{ steps.version.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Install cosign
        uses: sigstore/cosign-installer@398d4b0eeef1380460a10c8013a76f728fb906ac # v3.9.1

      - name: Sign the image (keyless)
        # Signs the *digest*, so every tag that points at this manifest
        # (`main`, `<sha>`) is covered by one signature. Keyless: the workflow's
        # OIDC identity is bound into a short-lived Fulcio certificate and the
        # signature is logged in Rekor — verification in docs/releases.md.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
