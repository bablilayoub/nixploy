name: Docker

# Continuous images for every main push: ghcr.io/<repo>:main and :<sha>, both
# linux/amd64 + linux/arm64 with provenance + SBOM, signed with cosign
# (keyless). :latest and :vX.Y.Z are owned by release.yml only
# (docs/releases.md).

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  # Keyless cosign: the job exchanges this OIDC token for a short-lived
  # Fulcio certificate and records the signature in Rekor. No private key,
  # nothing to rotate — see docs/releases.md for the verify command.
  id-token: write

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  build:
    name: Build ${{ matrix.platform }}
    # Version / release commits use [release] so only Release (tag v[0-9]*) builds that image.
    if: >-
      github.event_name == 'workflow_dispatch' ||
      (github.event.head_commit &&
       !contains(github.event.head_commit.message, '[release]') &&
       !contains(github.event.head_commit.message, '[ci skip]'))
    # One native runner per architecture instead of QEMU on amd64. Emulating
    # the arm64 Next.js build cost 15-80 min on its own; natively it is the
    # same few minutes as amd64 and the two legs run in parallel. Each job
    # pushes an untagged manifest by digest; `merge` assembles :main / :<sha>.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Read package version
        id: version
        run: echo "version=$(node -p "require('./package.json').version")" >> "$GITHUB_OUTPUT"

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          pull: true
          platforms: ${{ matrix.platform }}
          # No tag here: the image is addressed by digest until both
          # architectures are in, so :main never points at a half-built list.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # SLSA provenance + SPDX SBOM are attached as attestation manifests
          # (they show up as extra "unknown/unknown" entries in the GHCR UI).
          provenance: true
          sbom: true
          build-args: |
            NIXPLOY_APP_VERSION=${{ steps.version.outputs.version }}
            NIXPLOY_GIT_COMMIT=${{ github.sha }}
            NIXPLOY_APK_REFRESH=${{ github.run_id }}-${{ github.run_attempt }}
          # Per-architecture cache scope: a shared one would have the two
          # runners overwrite each other's cache manifest.
          cache-from: type=gha,scope=main-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=main-${{ matrix.platform }}

      - name: Trivy report (all severities, native architecture)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          format: json
          output: trivy.json
          severity: UNKNOWN,LOW,MEDIUM,HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "0"

      - name: Upload complete vulnerability report
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: trivy-docker-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: trivy.json
          if-no-files-found: error

      - name: Trivy gate (HIGH and CRITICAL are fatal)
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        env:
          TRIVY_PLATFORM: ${{ matrix.platform }}
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          scanners: vuln
          format: table
          severity: HIGH,CRITICAL
          ignore-unfixed: false
          exit-code: "1"
          skip-setup-trivy: true
          cache: false

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  merge:
    name: Manifest + sign
    needs: build
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Extract tags
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Continuous builds: `main` + commit sha only. `latest` is the release
          # channel the in-app updater tracks and is moved solely by the Release
          # workflow on a tag push (docs/releases.md).
          tags: |
            type=raw,value=main,enable={{is_default_branch}}
            type=sha,prefix=

      - name: Download the per-architecture digests
        uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Stage the manifest list
        id: manifest
        # Keep public tags on the previous signed image until this exact list
        # has been signed and verified. The unique staging tag also prevents
        # concurrent main builds from reading each other's digest.
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:build-${GITHUB_RUN_ID}-${GITHUB_RUN_ATTEMPT}" \
            --metadata-file "$RUNNER_TEMP/manifest.json" \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          DIGEST="$(jq -er '."containerimage.descriptor".digest | select(test("^sha256:[0-9a-f]{64}$"))' "$RUNNER_TEMP/manifest.json")"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "manifest ${DIGEST}"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        # Signs the *digest*, so every tag that points at this manifest
        # (`main`, `<sha>`) is covered by one signature. Keyless: the workflow's
        # OIDC identity is bound into a short-lived Fulcio certificate and the
        # signature is logged in Rekor — verification in docs/releases.md.
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Verify both installers against this signed digest
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          children=(/tmp/digests/*)
          tools/ci/check-installer-signatures.sh \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}" \
            "${REGISTRY}/${IMAGE_NAME}@sha256:${children[0]##*/}"

      - name: Publish signed tags
        env:
          DIGEST: ${{ steps.manifest.outputs.digest }}
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"
