name: Release

# Tag-driven PaaS release (Dokploy-style):
#   1. Bump package.json version (e.g. 0.1.0)
#   2. Commit, then: git tag v0.1.0 && git push origin v0.1.0
# The `checks` gate (typecheck, Biome, vitest incl. tenancy on Postgres 17,
# Traefik drift — .github/workflows/checks.yml, shared with CI) must pass on
# the tagged ref before anything is built. CI then builds/pushes GHCR
# (:vX.Y.Z, plus :latest for a final-version tag push) for linux/amd64 and
# linux/arm64 with provenance + SBOM attestations, creates a GitHub Release
# with auto-generated notes, and attaches version-pinned install.sh /
# update.sh. workflow_dispatch re-runs rebuild an existing tag's image and
# assets without moving :latest.

on:
  push:
    # PaaS only — do not use "v*" alone if it could collide; require digit after v.
    # CLI uses cli-v* → Publish CLI workflow.
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Checks
    # Quality gate on the exact ref being released. A red tree must never
    # become the :latest channel that every install auto-updates to.
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  release:
    needs: checks
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must start with v (got: $TAG)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Assert tag matches package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          EXPECTED="v${PKG}"
          if [ "${{ steps.tag.outputs.tag }}" != "$EXPECTED" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} does not match package.json version (expected $EXPECTED)"
            exit 1
          fi

      - name: Set up QEMU
        # linux/arm64 is emulated on the amd64 runner: the Next.js build runs
        # under QEMU and takes several times longer than the native build (expect
        # 20–40 min for a cold cache). Native `ubuntu-24.04-arm` runners plus a
        # manifest merge would be the fast path if this becomes a problem.
        uses: docker/setup-qemu-action@v3
        with:
          platforms: arm64

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Log in to GHCR
        uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether :latest moves
        id: latest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          # `latest` is the channel the in-app updater tracks: only a real tag
          # push of a final version moves it. Re-running an old tag through
          # workflow_dispatch (asset repair) or a prerelease must not rewind it.
          if [ "$EVENT" = "push" ] && printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "moving :latest to ${TAG}"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "not moving :latest (event=${EVENT}, tag=${TAG})"
          fi

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@v5
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Tags are decided in the step above; metadata-action only renders
          # them (ghcr.io/<repo>:vX.Y.Z [+ :latest], same as before) and adds
          # the OCI labels (source, revision, version, created, licenses).
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}
            type=raw,value=latest,enable=${{ steps.latest.outputs.move }}

      - name: Build and push
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ steps.meta.outputs.tags }}
          labels: ${{ steps.meta.outputs.labels }}
          # SLSA provenance + SPDX SBOM are attached as attestation manifests
          # (they show up as extra "unknown/unknown" entries in the GHCR UI).
          provenance: true
          sbom: true
          build-args: |
            NIXPLOY_APP_VERSION=${{ steps.tag.outputs.version }}
          cache-from: type=gha
          cache-to: type=gha,mode=max

      - name: Pin install.sh and update.sh
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          pin_script() {
            local src="$1"
            local dest="$2"
            # Dokploy-style: shebang, then forced default for this tag, then rest of script.
            {
              head -n 1 "$src"
              echo "NIXPLOY_VERSION=\"\${NIXPLOY_VERSION:-${TAG}}\""
              # Skip the in-repo default assignment so the injected line is authoritative.
              tail -n +2 "$src" | sed "/^NIXPLOY_VERSION=\"\${NIXPLOY_VERSION:-/d"
            } >"$dest"
            head -1 "$dest" | grep -q '^#!' || { echo "$dest missing shebang"; exit 1; }
            grep -q "NIXPLOY_VERSION=\"\${NIXPLOY_VERSION:-${TAG}}\"" "$dest" || {
              echo "$dest was not pinned to $TAG"
              exit 1
            }
            grep -q 'NIXPLOY_VERSION' "$dest" || { echo "$dest lost NIXPLOY_VERSION"; exit 1; }
          }
          pin_script install.sh install-release.sh
          pin_script update.sh update-release.sh
          mv install-release.sh install.sh
          mv update-release.sh update.sh

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            install.sh
            update.sh
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
