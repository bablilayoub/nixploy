name: Release

# Tag-driven PaaS release:
#   1. Bump package.json version (e.g. 0.1.0)
#   2. Commit, then: git tag v0.1.0 && git push origin v0.1.0
# The `checks` gate (typecheck, Biome, vitest incl. tenancy on Postgres 17,
# Traefik drift — .github/workflows/checks.yml, shared with CI) must pass on
# the tagged ref before anything is built. CI then builds/pushes GHCR
# :vX.Y.Z for linux/amd64 and linux/arm64 with provenance + SBOM attestations,
# scans it with Trivy (CRITICAL is fatal), signs the digest with cosign, and
# only then moves :latest — so a critical CVE cannot reach the channel every
# install auto-updates to. Finally it creates a GitHub Release with
# auto-generated notes and attaches version-pinned install.sh / update.sh /
# uninstall.sh plus SHA256SUMS. workflow_dispatch re-runs rebuild an existing
# tag's image and assets without moving :latest.

on:
  push:
    # PaaS only — do not use "v*" alone if it could collide; require digit after v.
    # CLI uses cli-v* → Publish CLI workflow.
    tags:
      - "v[0-9]*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Existing tag to (re)release, e.g. v0.1.0"
        required: true
        type: string

permissions:
  contents: write
  packages: write
  # Keyless cosign signing (Fulcio certificate + Rekor transparency log).
  id-token: write

concurrency:
  group: release-${{ github.ref }}
  cancel-in-progress: false

env:
  REGISTRY: ghcr.io
  IMAGE_NAME: ${{ github.repository }}

jobs:
  checks:
    name: Checks
    # Quality gate on the exact ref being released. A red tree must never
    # become the :latest channel that every install auto-updates to.
    uses: ./.github/workflows/checks.yml
    with:
      ref: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref }}

  build:
    name: Build ${{ matrix.platform }}
    needs: checks
    # One native runner per architecture instead of QEMU on amd64. The arm64
    # leg used to emulate the whole Next.js build: ~15 min on a good day and
    # 80+ on a bad one (v0.2.8). Each job pushes an untagged manifest by
    # digest and `release` merges them into the tag.
    runs-on: ${{ matrix.runner }}
    strategy:
      fail-fast: true
      matrix:
        include:
          - platform: linux/amd64
            runner: ubuntu-latest
          - platform: linux/arm64
            runner: ubuntu-24.04-arm
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must start with v (got: $TAG)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Assert tag matches package.json
        run: |
          PKG="$(node -p "require('./package.json').version")"
          EXPECTED="v${PKG}"
          if [ "${{ steps.tag.outputs.tag }}" != "$EXPECTED" ]; then
            echo "Tag ${{ steps.tag.outputs.tag }} does not match package.json version (expected $EXPECTED)"
            exit 1
          fi

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push by digest
        id: build
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: ${{ matrix.platform }}
          # No tag: the image is addressed by digest until the manifest list is
          # assembled, so a half-built release never occupies :vX.Y.Z.
          outputs: type=image,name=${{ env.REGISTRY }}/${{ env.IMAGE_NAME }},push-by-digest=true,name-canonical=true,push=true
          # SLSA provenance + SPDX SBOM are attached as attestation manifests
          # (they show up as extra "unknown/unknown" entries in the GHCR UI).
          provenance: true
          sbom: true
          build-args: |
            NIXPLOY_APP_VERSION=${{ steps.tag.outputs.version }}
          # Per-architecture cache scope: a shared one would have the two
          # runners overwrite each other's cache manifest.
          cache-from: type=gha,scope=release-${{ matrix.platform }}
          cache-to: type=gha,mode=max,scope=release-${{ matrix.platform }}

      - name: Export the digest
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          mkdir -p /tmp/digests
          touch "/tmp/digests/${DIGEST#sha256:}"

      - name: Upload the digest
        uses: actions/upload-artifact@043fb46d1a93c77aae656e7c1c64a875d1fc6a0a # v7.0.1
        with:
          name: digest-${{ matrix.platform == 'linux/amd64' && 'amd64' || 'arm64' }}
          path: /tmp/digests/*
          if-no-files-found: error
          retention-days: 1

  release:
    needs: [checks, build]
    runs-on: ubuntu-latest
    steps:
      - name: Resolve tag
        id: tag
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ]; then
            TAG="${{ inputs.tag }}"
          else
            TAG="${GITHUB_REF_NAME}"
          fi
          case "$TAG" in
            v*) ;;
            *)
              echo "Tag must start with v (got: $TAG)"
              exit 1
              ;;
          esac
          echo "tag=$TAG" >> "$GITHUB_OUTPUT"
          echo "version=${TAG#v}" >> "$GITHUB_OUTPUT"

      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          fetch-depth: 0
          ref: ${{ steps.tag.outputs.tag }}

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Log in to GHCR
        uses: docker/login-action@dbcb813823bdd20940b903addbd779551569679f # v4.6.0
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Decide whether :latest moves
        id: latest
        env:
          TAG: ${{ steps.tag.outputs.tag }}
          EVENT: ${{ github.event_name }}
        run: |
          # `latest` is the channel the in-app updater tracks: only a real tag
          # push of a final version moves it. Re-running an old tag through
          # workflow_dispatch (asset repair) or a prerelease must not rewind it.
          if [ "$EVENT" = "push" ] && printf '%s' "$TAG" | grep -Eq '^v[0-9]+\.[0-9]+\.[0-9]+$'; then
            echo "move=true" >> "$GITHUB_OUTPUT"
            echo "moving :latest to ${TAG}"
          else
            echo "move=false" >> "$GITHUB_OUTPUT"
            echo "not moving :latest (event=${EVENT}, tag=${TAG})"
          fi

      - name: Image tags and labels
        id: meta
        uses: docker/metadata-action@dc802804100637a589fabce1cb79ff13a1411302 # v6.2.0
        with:
          images: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}
          # Only the immutable version tag is built here. `:latest` is moved
          # further down, after Trivy and cosign, with `imagetools create` —
          # re-tagging an already-pushed manifest, not a second build.
          flavor: latest=false
          tags: |
            type=raw,value=${{ steps.tag.outputs.tag }}

      - name: Download the per-architecture digests
        uses: actions/download-artifact@3e5f45b2cfb9172054b4087a40e8e0b5a5461e7c # v8.0.1
        with:
          path: /tmp/digests
          pattern: digest-*
          merge-multiple: true

      - name: Create the manifest list
        id: build
        # Assembles the two per-architecture manifests into the tag. Everything
        # below (Trivy, cosign, :latest) works on the resulting list digest, so
        # the scanned and signed artefact is exactly what :vX.Y.Z resolves to.
        working-directory: /tmp/digests
        run: |
          set -euo pipefail
          # shellcheck disable=SC2046
          docker buildx imagetools create \
            $(jq -cr '.tags | map("-t " + .) | join(" ")' <<<"$DOCKER_METADATA_OUTPUT_JSON") \
            $(printf "${REGISTRY}/${IMAGE_NAME}@sha256:%s " *)
          DIGEST="$(docker buildx imagetools inspect \
            "${REGISTRY}/${IMAGE_NAME}:${{ steps.tag.outputs.tag }}" \
            --format '{{json .Manifest.Digest}}' | tr -d '"')"
          echo "digest=${DIGEST}" >> "$GITHUB_OUTPUT"
          echo "manifest ${DIGEST}"

      - name: Trivy scan (CRITICAL is fatal on a release)
        # Stricter than the PR scan (advisory, CRITICAL+HIGH): a release is the
        # artefact operators run as root with the Docker socket mounted, so a
        # fixable CRITICAL must stop it. `ignore-unfixed` keeps Alpine base
        # CVEs with no upstream patch from blocking a release nobody can fix.
        uses: aquasecurity/trivy-action@ed142fd0673e97e23eac54620cfb913e5ce36c25 # v0.36.0
        with:
          image-ref: ${{ env.REGISTRY }}/${{ env.IMAGE_NAME }}@${{ steps.build.outputs.digest }}
          scan-type: image
          format: table
          severity: CRITICAL
          ignore-unfixed: true
          exit-code: "1"

      - name: Install cosign
        uses: sigstore/cosign-installer@6f9f17788090df1f26f669e9d70d6ae9567deba6 # v4.1.2

      - name: Sign the image (keyless)
        # One signature on the digest covers :vX.Y.Z and, once it is moved
        # below, :latest. docs/releases.md carries the verify command.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: cosign sign --yes "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Move :latest
        if: steps.latest.outputs.move == 'true'
        # Re-tags the manifest that just passed Trivy and was signed; no
        # rebuild, so :latest and :vX.Y.Z are byte-identical by construction.
        env:
          DIGEST: ${{ steps.build.outputs.digest }}
        run: |
          docker buildx imagetools create \
            --tag "${REGISTRY}/${IMAGE_NAME}:latest" \
            "${REGISTRY}/${IMAGE_NAME}@${DIGEST}"

      - name: Pin install.sh and update.sh
        run: |
          TAG="${{ steps.tag.outputs.tag }}"
          pin_script() {
            local src="$1"
            local dest="$2"
            # Shebang, then the forced default for this tag, then the rest of the script.
            {
              head -n 1 "$src"
              echo "NIXPLOY_VERSION=\"\${NIXPLOY_VERSION:-${TAG}}\""
              # Skip the in-repo default assignment so the injected line is authoritative.
              tail -n +2 "$src" | sed "/^NIXPLOY_VERSION=\"\${NIXPLOY_VERSION:-/d"
            } >"$dest"
            head -1 "$dest" | grep -q '^#!' || { echo "$dest missing shebang"; exit 1; }
            grep -q "NIXPLOY_VERSION=\"\${NIXPLOY_VERSION:-${TAG}}\"" "$dest" || {
              echo "$dest was not pinned to $TAG"
              exit 1
            }
            grep -q 'NIXPLOY_VERSION' "$dest" || { echo "$dest lost NIXPLOY_VERSION"; exit 1; }
          }
          pin_script install.sh install-release.sh
          pin_script update.sh update-release.sh
          mv install-release.sh install.sh
          mv update-release.sh update.sh

      - name: Checksums for the shipped scripts
        # `curl … | sudo bash` has no integrity check of its own
        # (security.md §2.8). Publishing SHA256SUMS next to the release assets
        # lets an operator verify before running as root; docs/install.md
        # carries the two-line recipe. Checksums are taken AFTER pinning, so
        # they match exactly what the release serves.
        run: |
          set -euo pipefail
          sha256sum install.sh update.sh uninstall.sh > SHA256SUMS
          cat SHA256SUMS

      - name: Create GitHub Release
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64 # v3.0.3
        with:
          tag_name: ${{ steps.tag.outputs.tag }}
          name: ${{ steps.tag.outputs.tag }}
          generate_release_notes: true
          draft: false
          prerelease: ${{ contains(steps.tag.outputs.tag, '-') }}
          files: |
            install.sh
            update.sh
            uninstall.sh
            SHA256SUMS
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
