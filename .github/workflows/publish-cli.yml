name: Publish CLI

# Publishes @nixploy/cli to the npm registry.
# Trigger: push tag cli-v* (e.g. cli-v0.1.0) or manual workflow_dispatch.
#
# Requires repo secret NPM_TOKEN (Automation token with publish rights to @nixploy).
# Create the @nixploy org on npm first if it does not exist.

on:
  push:
    tags:
      - "cli-v*"
  workflow_dispatch:
    inputs:
      dry_run:
        description: "Run npm publish --dry-run (no upload)"
        type: boolean
        default: false

permissions:
  contents: read

concurrency:
  group: publish-cli-${{ github.ref }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: apps/cli
    steps:
      - name: Checkout
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0

      - name: Setup pnpm
        uses: pnpm/action-setup@b906affcce14559ad1aafd4ab0e942779e9f58b1 # v4.3.0

      - name: Setup Node
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: 22
          registry-url: https://registry.npmjs.org
          scope: "@nixploy"
          cache: pnpm
          cache-dependency-path: pnpm-lock.yaml

      - name: Install
        working-directory: .
        run: pnpm install --frozen-lockfile

      - name: Typecheck & build
        run: pnpm run prepublishOnly

      - name: Verify tag version matches package.json
        if: startsWith(github.ref, 'refs/tags/cli-v')
        run: |
          TAG="${GITHUB_REF_NAME#cli-v}"
          PKG="$(node -p "require('./package.json').version")"
          if [ "$TAG" != "$PKG" ]; then
            echo "Tag cli-v$TAG does not match package.json version $PKG"
            exit 1
          fi

      - name: Publish
        env:
          NODE_AUTH_TOKEN: ${{ secrets.NPM_TOKEN }}
        run: |
          if [ "${{ github.event_name }}" = "workflow_dispatch" ] && [ "${{ inputs.dry_run }}" = "true" ]; then
            pnpm publish --access public --no-git-checks --dry-run
          else
            pnpm publish --access public --no-git-checks
          fi
