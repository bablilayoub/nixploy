# Nixploy — Traefik v3 static configuration (reference copy).
#
# This file is NOT copied to hosts. install.sh and update.sh render the same
# content from an embedded heredoc (`NIXPLOY_RENDER_TRAEFIK_ONLY=1 bash
# install.sh` prints it), and the app regenerates it from
# packages/server/src/modules/traefik/setup.ts#buildTraefikStaticConfig when
# settings change. CI diffs all of them against this file, so edit them
# together. Only the ACME email differs per host (`nixploy@localhost` is the
# "unset" sentinel — Let's Encrypt rejects it; Settings → Platform or
# NIXPLOY_LETSENCRYPT_EMAIL replaces it).
#
# Routing is NOT stored here: Nixploy writes per-app dynamic YAML into
# /etc/nixploy/traefik/dynamic/, which the file provider watches and
# hot-reloads. A self-signed default certificate (00-default-tls.yml) covers
# bare-IP / first-boot HTTPS; app domains opt into `certResolver: letsencrypt`
# per router (no entrypoint-level resolver: bare IPs cannot use ACME).
# HTTP → HTTPS is redirected globally; ACME HTTP-01 still works because
# Traefik serves the challenge before applying the redirect.
# Logging stays at ERROR with no access log: the services run on the
# json-file driver with rotation, and an access log fills small hosts.
global:
  checkNewVersion: false
  sendAnonymousUsage: false
log:
  level: ERROR
entryPoints:
  web:
    address: ":80"
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
providers:
  file:
    directory: /etc/nixploy/traefik/dynamic
    watch: true
certificatesResolvers:
  letsencrypt:
    acme:
      email: nixploy@localhost
      storage: /etc/nixploy/traefik/acme.json
      httpChallenge:
        entryPoint: web
api:
  dashboard: false
