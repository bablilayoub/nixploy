# Nixploy — Traefik v3 static configuration (template).
# install.sh copies this to /etc/nixploy/traefik/traefik.yml on the host.
# ensureTraefikSetup() also regenerates it on app boot.
#
# Routing config is NOT stored here: Nixploy writes per-app dynamic YAML
# into /etc/nixploy/traefik/dynamic/, which the file provider watches and
# hot-reloads. A self-signed default certificate (00-default-tls.yml) covers
# bare-IP / first-boot HTTPS; app domains use Let's Encrypt per-router.

global:
  checkNewVersion: false
  sendAnonymousUsage: false

log:
  level: INFO

accessLog: {}

api:
  dashboard: false

ping: {}

entryPoints:
  web:
    address: ":80"
    # Force HTTPS. ACME HTTP-01 still works — Traefik serves the challenge
    # on this entrypoint before applying the redirect.
    http:
      redirections:
        entryPoint:
          to: websecure
          scheme: https
          permanent: true
  websecure:
    address: ":443"
    # No entrypoint-level certResolver: bare IPs cannot use Let's Encrypt.
    # Routers opt into `certResolver: letsencrypt` or fall back to the
    # defaultCertificate from 00-default-tls.yml.

providers:
  # File provider only — docker provider would let compose Traefik labels
  # hijack Host() rules on the shared edge. Nixploy writes dynamic YAML.
  file:
    directory: /etc/nixploy/traefik/dynamic
    watch: true

certificatesResolvers:
  letsencrypt:
    acme:
      # Overwritten by install.sh / Nixploy server settings (web-server-settings).
      email: admin@example.com
      storage: /etc/nixploy/traefik/acme.json
      httpChallenge:
        entryPoint: web
